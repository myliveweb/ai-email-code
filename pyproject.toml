[project]
name = "ai-email-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.16.1",
    "fastapi>=0.141.1",
    "langchain>=1.2.6",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.1",
    "langgraph>=1.0.6",
    "langgraph-checkpoint-postgres>=3.0.3",
    "loguru>=0.7.3",
    "psycopg[binary,pool]>=3.3.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.3",
    "supabase>=2.31.0",
    "tavily-python>=0.7.19",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Форматтер не включаем намеренно: он перекладывает файлы целиком, и правки Босса
# утонули бы в диффе. Из проверок — только настоящие ошибки и мёртвый код.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
